name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q
      - name: Tag matches package version
        run: |
          v=$(python -c "import secappliance; print(secappliance.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }

  wheel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: secappliance-linux-x86_64
          - os: windows-latest
            asset: secappliance-windows-x86_64.exe
          - os: macos-latest
            asset: secappliance-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller -e .
          pyinstaller packaging/SecAppliance.spec --noconfirm
          if [ -f dist/SecAppliance.exe ]; then mv dist/SecAppliance.exe "${{ matrix.asset }}"; else mv dist/SecAppliance "${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: [wheel, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
