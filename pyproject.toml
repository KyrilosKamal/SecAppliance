[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secappliance"
version = "2.2.0"
description = "Async network and web security scanner with offline and live CVE matching and HTML reporting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyrillos Kamal" }]
keywords = ["security", "scanner", "vulnerability", "pentest", "asyncio", "cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "click>=8.1",
    "colorama>=0.4.6",
    "jinja2>=3.1",
    "paramiko>=3.4",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "pywinrm>=0.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/KyrilosKamal/SecAppliance"
Issues = "https://github.com/KyrilosKamal/SecAppliance/issues"
Changelog = "https://github.com/KyrilosKamal/SecAppliance/blob/main/CHANGELOG.md"

[project.scripts]
secappliance = "secappliance.cli:main"

[tool.setuptools.packages.find]
include = ["secappliance*"]

[tool.setuptools.package-data]
secappliance = ["data/*.json", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
